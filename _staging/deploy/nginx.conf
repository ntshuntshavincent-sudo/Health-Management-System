# ── /etc/nginx/sites-available/patient-system ────────────────────────────────
#
# WHAT THIS FILE DOES:
#   1. Redirects all HTTP traffic to HTTPS (port 80 → 443)
#   2. Terminates SSL — nginx handles encryption, Node.js stays plain HTTP
#   3. Reverse-proxies HTTPS traffic to your Node.js app on port 3000
#   4. Serves the React frontend as static files (fastest possible delivery)
#   5. Adds extra security headers
#
# SETUP STEPS (run as root/sudo on your Ubuntu server):
#
#   sudo apt install nginx certbot python3-certbot-nginx -y
#
#   # Copy this file
#   sudo cp nginx.conf /etc/nginx/sites-available/patient-system
#
#   # Edit the server_name lines below to match your actual domain
#   sudo nano /etc/nginx/sites-available/patient-system
#
#   # Enable the site
#   sudo ln -s /etc/nginx/sites-available/patient-system /etc/nginx/sites-enabled/
#   sudo nginx -t        # test for syntax errors
#   sudo systemctl reload nginx
#
#   # Get a free SSL certificate from Let's Encrypt (replace with your domain)
#   sudo certbot --nginx -d yourhospital.co.za -d www.yourhospital.co.za
#
#   # Certbot auto-edits this file to add SSL. Auto-renewal is set up for you.
#   sudo systemctl enable certbot.timer


# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourhospital.co.za www.yourhospital.co.za;

    # Let's Encrypt renewal challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourhospital.co.za www.yourhospital.co.za;

    # SSL certificates (Certbot will fill these in automatically)
    ssl_certificate     /etc/letsencrypt/live/yourhospital.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourhospital.co.za/privkey.pem;

    # Strong SSL settings — disables old insecure protocols
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers (extra layer on top of Helmet in Node.js)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header Referrer-Policy           "strict-origin"  always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Limit request body size (prevents large payload attacks)
    client_max_body_size 5M;

    # ── React frontend ────────────────────────────────────────────────────────
    # Serve the built React app as static files. This is much faster
    # than serving them through Node.js.
    root /var/www/patient-system/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # React Router support

        # Cache HTML for a short time only (it references hashed JS/CSS files)
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache static assets aggressively (React gives them unique hashed filenames)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API reverse proxy ─────────────────────────────────────────────────────
    # Forward /api/* requests to the Node.js backend running on port 3000
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # Health check (used by monitoring tools)
    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # Block access to hidden files (like .env, .git)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Logging
    access_log /var/log/nginx/patient-system.access.log;
    error_log  /var/log/nginx/patient-system.error.log;
}
